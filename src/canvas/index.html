<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Egakium</title>
    <style>
      :root {
        color-scheme: light;
        background: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      #egakium-canvas {
        position: relative;
        width: 100%;
        height: 100%;
        background: #fff;
        isolation: isolate;
      }
    </style>
  </head>
  <body>
    <main id="egakium-canvas" aria-label="Egakium 白画布"></main>
  </body>
</html>
